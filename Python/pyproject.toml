[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[project]
name = "blockchain_visualizer"
version = "0.1.0"
description = "A simple Python blockchain implementation and visualization-oriented library"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

authors = [
    { name = "Saumya Kanti Sarma" }
]

keywords = [
    "blockchain",
    "blockchain_visualizer",
    "data-structures",
    "linked-list",
    "cryptography",
    "sha256"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
    "Topic :: Education"
]


[tool.setuptools.packages.find]
where = ["src"]